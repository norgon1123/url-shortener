# Agentic SDLC pipeline definition.
#
# This file is the orchestrator's dependency graph. It is declarative on
# purpose: the scheduler, gates, and policy engine read it, and nothing about
# the graph shape is hardcoded in Python. Swapping this file swaps the process.
#
# Gate classes (ADR-001):
#   mechanical   - fully deterministic; exit codes and thresholds
#   self_report  - schema/threshold check on a field the LLM emitted; MUST be
#                  backstopped by a downstream human gate
#   human        - explicit approval, persisted with the approver's note
version: 1

defaults:
  model: claude-opus-5
  effort: high
  autonomy: apply
  retry:
    max_attempts: 2
    backoff_seconds: 5
  on_failure: retry

budget:
  # Sized from measured runs rather than guessed. The 11-node graph cost about
  # $17; the 19-node graph reached `verify` at $25 before the review fan-out,
  # which is the expensive half and has never been measured. The requirement has
  # since roughly doubled in scope -- accounts, password storage, sessions,
  # rate limiting, abuse handling and a cache tier on top of the original CRUD --
  # so the ceiling moves with it.
  #
  # A ceiling below what a healthy run costs does not protect anything: it
  # safe-stops every run at the same place and trains whoever is watching to
  # raise it without looking. A breach is recoverable -- raise it and resume --
  # so the cost of setting it too high is real spend, and the cost of setting it
  # too low is an hour of wall clock and a run stopped mid-branch.
  #
  # Denominated in estimated dollars, which is not money anyone is billed: runs
  # authenticate with a Claude Max subscription, and the figure is derived from
  # token counts at API list rates. It is a real ceiling on how much model work
  # a run may do, and it is not protecting an invoice. The binding constraint is
  # the subscription's quota, which nothing here reads. See docs/OPERATIONS.md.
  max_cost_usd: 120.0
  max_wallclock_seconds: 10800

policy:
  # Writes to these paths force PENDING_APPROVAL regardless of node autonomy.
  # Enforced live via the Agent SDK can_use_tool callback, and again after the
  # node returns by diffing the worktree (belt and braces: the callback can be
  # bypassed by a Bash heredoc, the diff classifier cannot).
  protected_paths:
    - "service/pom.xml"
    - "service/src/main/resources/db/migration/**"
    - "service/src/main/resources/application*.yml"
    - "docker-compose.yml"

  # No node may ever write here. Agents do not modify the orchestrator that
  # governs them, and they do not touch git internals.
  forbidden_paths:
    - ".git/**"
    - "orchestrator/**"
    - "docs/adr/**"
    - "**/.env"
    - "**/*.pem"
    - "**/id_rsa*"

  forbidden_commands:
    - "git push"
    - "git reset --hard"
    - "git clean"
    - "rm -rf /"
    - "sudo"
    - "curl"
    - "wget"

  secret_patterns:
    - "sk-ant-[A-Za-z0-9_-]{20,}"
    - "AKIA[0-9A-Z]{16}"
    - "-----BEGIN [A-Z ]*PRIVATE KEY-----"
    - "(?i)(password|passwd|secret|token)\\s*[:=]\\s*['\"][^'\"]{8,}['\"]"

  # Real enforced egress control, not a best-effort command deny-list.
  # Maven needs Central; nothing else needs the network.
  sandbox:
    enabled: true
    network:
      allowedDomains:
        - "repo.maven.apache.org"
        - "repo1.maven.org"
      allowLocalBinding: true

nodes:
  - id: intake
    description: Normalize a raw requirement into a structured engineering problem.
    prompt: intake.md
    tools: [Read, Write]
    write_paths: ["artifacts/**"]
    output_schema: requirement
    effort: medium
    entry_gates:
      - {check: artifact_present, gate_class: mechanical, path: "input/requirement.txt"}
    exit_gates:
      - {check: schema_valid, gate_class: mechanical, artifact: requirement.json}
      - {check: paths_confined, gate_class: mechanical}

  - id: clarify
    description: Identify ambiguity. Emit assumptions even when nothing is ambiguous.
    prompt: clarify.md
    tools: [Read, Write]
    write_paths: ["artifacts/**"]
    output_schema: clarification
    depends_on: [intake]
    entry_gates:
      - {check: artifact_present, gate_class: mechanical, path: "artifacts/requirement.json"}
    exit_gates:
      - {check: schema_valid, gate_class: mechanical, artifact: clarification.json}
      # ADR-001: this is a self-report gate. The LLM populates the field the
      # predicate reads, so it cannot be trusted alone -- assumptions are
      # forced non-empty and surfaced at the design human gate below.
      - {check: assumptions_present, gate_class: self_report, artifact: clarification.json}
      - {check: no_blocking_ambiguities, gate_class: self_report, artifact: clarification.json,
         on_fail: escalate}

  # ---- understanding the ground before planning on it ------------------
  #
  # Both of these sit between `clarify` and `decompose`, and both run on every
  # scenario rather than being switched on for the one they were added for.
  # A node that decides "nothing is impacted" or "nothing is unknown" leaves an
  # artifact a human can disagree with; a node that was configured not to run
  # leaves nothing, and the absence is indistinguishable from a clean result.

  - id: impact-analysis
    description: >
      Identify what existing behaviour this change touches: modules, services,
      APIs, data flows, and what breaks if it is wrong. On greenfield work the
      honest output is a near-empty impact set, explicitly stated.
    prompt: impact-analysis.md
    tools: [Read, Grep, Glob, Bash]
    write_paths: ["artifacts/**"]
    output_schema: impact
    depends_on: [clarify]
    effort: high
    entry_gates:
      - {check: artifact_present, gate_class: mechanical, path: "artifacts/clarification.json"}
    exit_gates:
      - {check: schema_valid, gate_class: mechanical, artifact: impact.json}
      - {check: paths_confined, gate_class: mechanical}

  - id: feasibility
    description: >
      Bounded exploration of what is still unknown. Produces questions,
      evidence, and options -- never code. This is the node that serves the
      ambiguous scenario, where the cheapest way to resolve a question is to go
      and look rather than to guess in a design document.
    prompt: feasibility.md
    tools: [Read, Grep, Glob, Bash]
    write_paths: ["artifacts/**"]
    # A spike that leaves code behind is not a spike, it is an unreviewed
    # implementation that skipped the contract. Enforced, not requested.
    #
    # The orchestrator, its runs and its documentation are out of scope for the
    # same reason: on the first live run this node spent part of its budget
    # asking whether the `verify` gate's process would have Docker group
    # membership, and whether the implementation plan was still current. Neither
    # is a question about the service under change, and on brownfield work that
    # budget belongs to the codebase.
    deny_paths: ["service/**", "docs/**", "orchestrator/**", "runs/**"]
    output_schema: feasibility
    depends_on: [clarify, impact-analysis]
    effort: high
    exit_gates:
      - {check: schema_valid, gate_class: mechanical, artifact: feasibility.json}
      - {check: paths_confined, gate_class: mechanical}

  - id: decompose
    description: Convert the clarified requirement into a task DAG with dependencies.
    prompt: decompose.md
    tools: [Read, Write, Grep, Glob]
    write_paths: ["artifacts/**"]
    output_schema: plan
    # `clarify` is already an ancestor via both analysis nodes. The edge is
    # declared anyway because the engine passes an upstream artifact as context
    # only along a direct edge, and the plan is derived from all three.
    depends_on: [clarify, impact-analysis, feasibility]
    entry_gates:
      - {check: no_unresolved_ambiguities, gate_class: mechanical}
    exit_gates:
      - {check: schema_valid, gate_class: mechanical, artifact: plan.json}
      - {check: plan_is_dag, gate_class: mechanical, artifact: plan.json}
      # Nothing downstream measures the work against the requirement -- every
      # later check measures it against this plan. A criterion dropped here is
      # dropped silently and permanently.
      - {check: criteria_covered, gate_class: mechanical, artifact: plan.json}

  - id: design
    description: >
      Produce the frozen contract. Everything the parallel branches need to work
      independently is fixed here: OpenAPI spec, compilable interfaces and DTOs,
      and the finalized pom.xml. Neither branch may change it afterwards.
    prompt: design.md
    tools: [Read, Write, Edit, Grep, Glob, Bash]
    write_paths: ["artifacts/**", "service/src/main/java/**", "service/pom.xml"]
    output_schema: design
    depends_on: [decompose]
    effort: xhigh
    entry_gates:
      - {check: artifact_present, gate_class: mechanical, path: "artifacts/plan.json"}
    exit_gates:
      - {check: schema_valid, gate_class: mechanical, artifact: design.json}
      - {check: openapi_lints, gate_class: mechanical, artifact: openapi.yaml}
      - {check: maven_compiles, gate_class: mechanical}

  - id: test-contract
    description: >
      The executable half of the freeze. Test classes, behaviour-named method
      signatures, and the shared harness -- structure only, no assertions. Both
      branches build against it, so they agree on what will be proven and how a
      test reaches the service before either starts.
    prompt: test-contract.md
    tools: [Read, Write, Edit, Grep, Glob, Bash]
    write_paths: ["artifacts/**", "service/src/test/**"]
    deny_paths: ["service/src/main/**", "service/pom.xml"]
    output_schema: test-contract
    depends_on: [design]
    effort: high
    entry_gates:
      - {check: artifact_present, gate_class: mechanical, path: "artifacts/design.json"}
    exit_gates:
      - {check: schema_valid, gate_class: mechanical, artifact: test-contract.json}
      - {check: tests_compile, gate_class: mechanical}
      # The line that keeps two authors from collapsing into one. A skeleton
      # arriving with assertions has already done author-tests' job, and
      # `implement` would then be reading finished tests.
      - {check: no_assertions, gate_class: mechanical}
      # Records the starting size of the suite, so a later repair cannot shrink
      # it. Written by the gate: a baseline the audited party supplies is not
      # a baseline.
      - {check: tests_not_weakened, gate_class: mechanical}
      - {check: paths_confined, gate_class: mechanical}
      # The single approval covers both halves: the API, and the plan for
      # proving it works. Reviewing them together is the highest-leverage
      # checkpoint in the graph -- it is where a wrong shared premise is
      # cheapest to catch, before either branch has written a line against it.
      - {check: human_approval, gate_class: human,
         reason: "Frozen contract review: the API and the proof (four-eyes)"}

  # ---- parallel branch -------------------------------------------------
  # implement and author-tests fan out from the frozen contract into separate
  # git worktrees and rejoin at the barrier below.
  #
  # The allowlists are the segregation-of-duties control (ADR-003):
  # `implement` cannot write to src/test, so the agent producing the code is
  # structurally incapable of weakening the tests that gate it. That control is
  # untouched by the shared skeleton: both branches read the same specification,
  # and only one of them may edit the tests.

  - id: implement
    description: Implement the contract. Cannot touch tests.
    prompt: implement.md
    tools: [Read, Write, Edit, Grep, Glob, Bash]
    write_paths: ["service/src/main/**"]
    deny_paths: ["service/src/test/**", "service/pom.xml"]
    depends_on: [test-contract]
    worktree: implement
    effort: xhigh
    retry: {max_attempts: 3, backoff_seconds: 10}
    on_failure: retry
    # Repairing an implementation to satisfy a test is the safe direction: the
    # test is the specification, and this node cannot edit it.
    repair_attempts: 2
    entry_gates:
      - {check: contract_frozen, gate_class: mechanical,
         artifacts: [design.json, test-contract.json]}
    exit_gates:
      - {check: maven_compiles, gate_class: mechanical}
      - {check: paths_confined, gate_class: mechanical}
      - {check: no_secrets, gate_class: mechanical}

  - id: author-tests
    description: >
      Fill the frozen test skeleton with real assertions. Never sees the
      implementation, and cannot write to it: a shared specification, with
      separated authorship.
    prompt: author-tests.md
    tools: [Read, Write, Edit, Grep, Glob, Bash]
    write_paths: ["service/src/test/**"]
    deny_paths: ["service/src/main/**", "service/pom.xml"]
    depends_on: [test-contract]
    worktree: tests
    effort: high
    # One attempt, against implement's two. Repairing a test to satisfy an
    # implementation is the agent editing the thing that judges it, so it gets
    # a single try and then a human looks.
    repair_attempts: 1
    entry_gates:
      - {check: contract_frozen, gate_class: mechanical,
         artifacts: [design.json, test-contract.json]}
    exit_gates:
      - {check: tests_compile, gate_class: mechanical}
      # The suite may grow across a repair; it may never shrink. Deleting,
      # gutting, or disabling the failing test is the obvious way to go green.
      - {check: tests_not_weakened, gate_class: mechanical}
      - {check: paths_confined, gate_class: mechanical}

  - id: join
    description: Merge the parallel worktrees. Conflict escalates to a human.
    type: barrier
    depends_on: [implement, author-tests]
    exit_gates:
      - {check: merge_clean, gate_class: mechanical, on_fail: escalate}

  # ---- verification ----------------------------------------------------

  - id: verify
    description: The authoritative mechanical gate.
    type: deterministic          # no LLM call at all
    depends_on: [join]
    # Ask which artifact is wrong before re-deriving everything. Replanning is
    # still the fallback -- `triage` hands back to it when it cannot tell, or
    # when the targeted repair does not take.
    on_failure: triage
    triage_node: triage
    replan_target: decompose
    replan_after_attempts: 2
    max_replans: 2
    exit_gates:
      # The integration suite starts real containers, so the ceiling is stated
      # here with the rest of the policy rather than left to a default buried
      # in the runner. A timeout reports as `exited 124` with no coverage
      # report, which reads like a broken build; it is a clock.
      - {check: maven_verify, gate_class: mechanical, timeout_seconds: 5400}
      - {check: coverage_floor, gate_class: mechanical, min_line_coverage: 0.70}
      - {check: routes_match_openapi, gate_class: mechanical}

  - id: triage
    description: >
      Which artifact is actually wrong -- the implementation, the tests, or the
      contract? Runs only when `verify` fails. Read-only, advisory, and it
      decides where to spend the next attempt, never whether the run passes.
    type: handler                # invoked by a failure, never by the scheduler
    prompt: triage.md
    tools: [Read, Grep, Glob, Bash]
    write_paths: ["artifacts/**"]
    output_schema: triage
    effort: high
    exit_gates:
      - {check: schema_valid, gate_class: mechanical, artifact: triage.json}
      - {check: paths_confined, gate_class: mechanical}

  # ---- documentation and review, in parallel ---------------------------
  #
  # Everything below depends only on `verify`, so it all runs at once. Two
  # different kinds of parallelism are in play here and they are worth telling
  # apart, because only one of them is a governance argument:
  #
  #   * `docs` alongside the reviewers buys **wall-clock**. Review does not read
  #     the documentation, so the old edge from `docs` to `review` was ordering
  #     without a reason, and paid for on every run.
  #
  #   * The five review lenses buy **independence**. One reviewer asked for
  #     everything produces one reviewer's blind spot; five reviewers with
  #     narrow, disjoint briefs cannot agree to overlook the same thing,
  #     because none of them is looking at the same thing. Diversity of
  #     perspective is the control. That it is also faster is incidental.
  #
  # Each writing node gets its own worktree -- required by the loader for
  # concurrent writers, and the reason a lens cannot see (or be blamed for)
  # another lens's diff.

  - id: docs
    description: Generate user-facing documentation from the contract and code.
    prompt: docs.md
    tools: [Read, Write, Edit, Grep, Glob]
    write_paths: ["docs/**", "README.md"]
    depends_on: [verify]
    worktree: docs
    effort: medium
    on_failure: fallback          # degrade to `propose`; a human applies the diff
    exit_gates:
      - {check: paths_confined, gate_class: mechanical}
      - {check: links_resolve, gate_class: mechanical}

  # The five lenses. Identical shape, disjoint briefs, no shared state. Each is
  # read-only over the code: the artifact is written by the orchestrator from
  # the node's structured output, so none of them needs a Write tool.

  - id: review-security
    description: Security review. Advisory; findings are preserved and adjudicated downstream.
    prompt: review-security.md
    tools: [Read, Grep, Glob, Bash]
    write_paths: ["artifacts/**"]
    output_schema: review-security
    depends_on: [verify]
    worktree: review-security
    effort: xhigh
    exit_gates:
      - {check: schema_valid, gate_class: mechanical, artifact: review-security.json}
      - {check: paths_confined, gate_class: mechanical}

  - id: review-performance
    description: Performance, resource, and scalability review.
    prompt: review-performance.md
    tools: [Read, Grep, Glob, Bash]
    write_paths: ["artifacts/**"]
    output_schema: review-performance
    depends_on: [verify]
    worktree: review-performance
    effort: high
    exit_gates:
      - {check: schema_valid, gate_class: mechanical, artifact: review-performance.json}
      - {check: paths_confined, gate_class: mechanical}

  - id: review-api-contract
    description: Conformance of the implementation to the frozen OpenAPI contract.
    prompt: review-api-contract.md
    tools: [Read, Grep, Glob, Bash]
    write_paths: ["artifacts/**"]
    output_schema: review-api-contract
    depends_on: [verify]
    worktree: review-api-contract
    effort: high
    exit_gates:
      - {check: schema_valid, gate_class: mechanical, artifact: review-api-contract.json}
      - {check: paths_confined, gate_class: mechanical}

  - id: review-test-adequacy
    description: >
      Do the tests actually pin the new behaviour? Coverage percentage cannot
      answer this; reading the assertions can.
    prompt: review-test-adequacy.md
    tools: [Read, Grep, Glob, Bash]
    write_paths: ["artifacts/**"]
    output_schema: review-test-adequacy
    depends_on: [verify]
    worktree: review-test-adequacy
    effort: xhigh
    exit_gates:
      - {check: schema_valid, gate_class: mechanical, artifact: review-test-adequacy.json}
      - {check: paths_confined, gate_class: mechanical}

  - id: review-cleanliness
    description: Readability, structure, and consistency with the surrounding code.
    prompt: review-cleanliness.md
    tools: [Read, Grep, Glob, Bash]
    write_paths: ["artifacts/**"]
    output_schema: review-cleanliness
    depends_on: [verify]
    worktree: review-cleanliness
    effort: medium
    exit_gates:
      - {check: schema_valid, gate_class: mechanical, artifact: review-cleanliness.json}
      - {check: paths_confined, gate_class: mechanical}

  - id: review-join
    description: Merge the documentation and review branches back into the workspace.
    type: barrier
    depends_on:
      - docs
      - review-security
      - review-performance
      - review-api-contract
      - review-test-adequacy
      - review-cleanliness
    exit_gates:
      - {check: merge_clean, gate_class: mechanical, on_fail: escalate}

  - id: review-synthesis
    description: >
      Fold five independent reviews into one decision brief. ADVISORY ONLY --
      cannot fail the run (ADR-001). May cluster and rank; may not drop or
      soften, which is checked mechanically rather than trusted.
    prompt: review-synthesis.md
    tools: [Read, Grep, Glob, Bash]
    write_paths: ["artifacts/**"]
    output_schema: review
    # The barrier supplies the merged tree; the direct edges to each lens
    # supply their artifacts as explicit upstream context.
    depends_on:
      - review-join
      - review-security
      - review-performance
      - review-api-contract
      - review-test-adequacy
      - review-cleanliness
    effort: xhigh
    exit_gates:
      - {check: schema_valid, gate_class: mechanical, artifact: review.json}
      # The control that makes the fan-out mean something: a join that can
      # silently drop a lens's blocker is a join that undoes the fan-out.
      - {check: lens_findings_preserved, gate_class: mechanical, artifact: review.json}
      - {check: static_analysis, gate_class: mechanical, max_severity: high}
      - {check: blocker_findings_escalate, gate_class: self_report, artifact: review.json,
         on_fail: escalate}
      - {check: paths_confined, gate_class: mechanical}

  - id: release-readiness
    description: Final human sign-off before anything leaves the machine.
    prompt: release-readiness.md
    tools: [Read, Grep, Glob, Bash]
    write_paths: ["artifacts/**"]
    output_schema: release
    depends_on: [review-synthesis]
    autonomy: propose
    effort: medium
    exit_gates:
      - {check: human_approval, gate_class: human,
         reason: "Release sign-off: review full diff before push/PR"}
